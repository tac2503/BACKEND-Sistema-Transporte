---
name: CI_Pull_Request

'on':
  pull_request:
    branches: [dev]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint-and-test:
    timeout-minutes: 10
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
          POSTGRES_DB: banco_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: postgresql://test:test@localhost:5432/banco_test
      SSL_MODE: disable

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configurar python
        uses: actions/setup-python@v5
        with:
          python-version: '3.14'

      - name: Cache de dependencias
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('**/requirements.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-

      - name: Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install ruff pip-audit

      - name: Lint con Ruff
        run: ruff check src --output-format=github

      - name: Formato con Ruff
        run: ruff format src --check

      - name: Verificar vulnerabilidades (pip-audit)
        run: pip-audit

      - name: Crear/actualizar BD (migración)
        run: python src/database/migrate.py

      - name: Seed (datos iniciales)
        run: python src/database/seed.py

      - name: Pruebas (smoke test)
        run: |
          python - <<'PY'
          from fastapi.testclient import TestClient
          from app import app

          client = TestClient(app)
          response = client.get('/docs')
          assert response.status_code == 200
          print('Smoke test OK')
          PY
